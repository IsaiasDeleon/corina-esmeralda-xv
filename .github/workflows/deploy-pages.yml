name: Publicar Esmeralda en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar sitio estático
        run: |
          mkdir site
          cp index.html style.css app.js config.js preview.png preview.svg favicon.svg .nojekyll site/
          cp -R assets catalogo site/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos publicados
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
